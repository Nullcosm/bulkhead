[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bulkhead-py"
version = "0.1.0"
description = "Python SDK for Bulkhead, the governance plane for AI agent fleets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
include = ["bulkhead_py*"]
